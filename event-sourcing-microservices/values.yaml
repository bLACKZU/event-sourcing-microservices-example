# Default values for event-sourcing-microservices.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

microservices:
  - name: user-service
    image:
      repository: blackzu69/event-sourcing-microservices-example-user-service
      tag: latest
      labels:
        app: user-service
    service:
      port: 8120
    env:
      - name: SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS
        value: "kafka"
      - name: SPRING_CLOUD_STREAM_KAFKA_BINDER_DEFAULTBROKERPORT
        value: "29092"
      - name: SPRING_PROFILES_ACTIVE
        value: kubernetes
      - name: KUBERNETES_TRUST_CERTIFICATES
        value: "true"
    serviceAccount:
      create: true
      automount: true
      # The name of the service account to use.
      # If not set and create is true, a name is generated using the fullname template
      name: "user-service-sa"

    
  - name: friend-service
    image:
      repository: blackzu69/event-sourcing-microservices-example-friend-service
      tag: latest
      labels:
        app: friend-service
    service:
      port: 8100
    env:
      - name: SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS
        value: "kafka"
      - name: SPRING_CLOUD_STREAM_KAFKA_BINDER_DEFAULTBROKERPORT
        value: "29092"
      - name: SPRING_PROFILES_ACTIVE
        value: kubernetes
      - name: KUBERNETES_TRUST_CERTIFICATES
        value: "true"
    serviceAccount:
      create: true
      automount: true
      # The name of the service account to use.
      # If not set and create is true, a name is generated using the fullname template
      name: "friend-service-sa"
  - name: recommendation-service
    image:
      repository: blackzu69/event-sourcing-microservices-example-recommendation-service
      tag: latest
      labels:
        app: recommendation-service
    service:
      port: 8110
    env:
      - name: SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS
        value: "kafka"
      - name: SPRING_CLOUD_STREAM_KAFKA_BINDER_DEFAULTBROKERPORT
        value: "29092"
      - name: SPRING_PROFILES_ACTIVE
        value: kubernetes
      - name: KUBERNETES_TRUST_CERTIFICATES
        value: "true"
    serviceAccount:
      create: true
      automount: true
      # The name of the service account to use.
      # If not set and create is true, a name is generated using the fullname template
      name: "recommendation-service-sa"
