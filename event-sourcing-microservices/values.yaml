  - name: edge-service
    image:
      repository: blackzu69/event-sourcing-microservices-example-edge-service
      tag: latest
      labels:
        app: edge-service
    service:
      port: 9000
    env:
      - name: SPRING_PROFILES_ACTIVE
        value: kubernetes
      - name: KUBERNETES_TRUST_CERTIFICATES
        value: "true"
    serviceAccount:
      create: true
      automount: true
      # The name of the service account to use.
      # If not set and create is true, a name is generated using the fullname template
      name: "edge-service-sa"

replicaCount: 1
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 2000
  runAsGroup: 2000
  fsGroup: 2000

postgresql:
  replicaCount: 2
  dbsecurityContext:
    fsGroup: 1001
  dbenv:
    - name: BITNAMI_DEBUG
      value: "false"
    # PostgreSQL configuration
    - name: POSTGRESQL_VOLUME_DIR
      value: "/bitnami/postgresql"
    - name: PGDATA
      value: "/bitnami/postgresql/data"
    - name: POSTGRES_USER
      value: "postgres"
    - name: POSTGRES_DB
      value: "postgres"
    - name: POSTGRESQL_LOG_HOSTNAME
      value: "true"
    - name: POSTGRESQL_LOG_CONNECTIONS
      value: "false"
    - name: POSTGRESQL_LOG_DISCONNECTIONS
      value: "false"
    - name: POSTGRESQL_PGAUDIT_LOG_CATALOG
      value: "off"
    - name: POSTGRESQL_CLIENT_MIN_MESSAGES
      value: "error"
    - name: POSTGRESQL_SHARED_PRELOAD_LIBRARIES
      value: "pgaudit, repmgr"
    - name: POSTGRESQL_ENABLE_TLS
      value: "no"
    - name: REPMGR_UPGRADE_EXTENSION
      value: "no"
    - name: REPMGR_PGHBA_TRUST_ALL
      value: "no"
    - name: REPMGR_MOUNTED_CONF_DIR
      value: "/bitnami/repmgr/conf"
    - name: REPMGR_LOG_LEVEL
      value: "NOTICE"
    - name: REPMGR_CONNECT_TIMEOUT
      value: "5"
    - name: REPMGR_RECONNECT_ATTEMPTS
      value: "3"
    - name: REPMGR_RECONNECT_INTERVAL
      value: "5"
    - name: REPMGR_USERNAME
      value: "repmgr"
    - name: REPMGR_DATABASE
      value: "repmgr"



kafka:
  fullnameOverride: kafka
  image:
    registry: docker.io
    repository: apache/kafka
    tag: 4.3.0-rc0
  controller:
    replicaCount: 1
  config: |-
    listeners=PLAINTEXT://:29092
    advertised.listeners=PLAINTEXT://kafka:29092
    broker.id=1
    offsets.topic.replication.factor=1
    zookeeper.connect=zookeeper:32181

neo4j:
  neo4j:
    name: neo4j
    fullnameOverride: neo4j
    edition: "community"
    resources:
      cpu: "0.5"
      memory: "2Gi"
  config:
    dbms.security.auth_enabled: "false"
  volumes:
    data:
      mode: defaultStorageClass
      defaultStorageClass:
        accessModes:
          - ReadWriteOnce
        requests:
          storage: 1Gi



image:
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""


securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

startupProbe:
  httpGet:
    path: /actuator/health
    port: http
  failureThreshold: 30
  periodSeconds: 10
livenessProbe:
  httpGet:
    path: /actuator/health
    port: http
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /actuator/health
    port: http
  periodSeconds: 10

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

