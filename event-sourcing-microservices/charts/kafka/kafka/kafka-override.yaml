global:
  security:
    allowInsecureImages: true
fullnameOverride: kafka
image:
  registry: public.ecr.aws
  repository: bitnami/kafka
  tag: 4.1.1-debian-12-r0
controller:
  replicaCount: 1
broker:
  replicaCount: 1
  persistence:
    enabled: true
defaultInitContainers:
  volumePermissions:
    enabled: false
    image:
      registry: docker.io
      repository: bitnami/os-shell
      tag: 12-debian-12-r50
      digest: ""
      pullPolicy: IfNotPresent


  config: |-
    listeners=PLAINTEXT://:29092
    advertised.listeners=PLAINTEXT://kafka:29092
    broker.id=1
    offsets.topic.replication.factor=1
    zookeeper.connect=zookeeper:32181