apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "postgresql.fullname" . }}-sts
spec:
  serviceName: {{ include "postgresql.fullname" . }}-svc
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext: 
        {{- toYaml .Values.dbsecurityContext | nindent 8 }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - postgres
            topologyKey: "kubernetes.io/hostname"
      containers:
        - name: postgresql
          lifecycle:
            preStop:
              exec:
                command:
                  - /pre-stop.sh
          image: public.ecr.aws/bitnami/postgresql-repmgr:12.9.0-debian-10-r18
          imagePullPolicy: "IfNotPresent"
          securityContext:
            runAsUser: 1001
          # Auxiliary vars to populate environment variables
          env:
            {{- toYaml .Values.dbenv | nindent 12 }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret | default (include "postgresql.fullname" .) | printf "%s-secrets" }}
                  key: postgresql-password
            - name: REPMGR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret | default (include "postgresql.fullname" .) | printf "%s-secrets" }}
                  key: repmgr-password
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: REPMGR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: REPMGR_NODE_NAME
              value: "$(MY_POD_NAME)"
            - name: REPMGR_NODE_NETWORK_NAME
              value: "$(MY_POD_NAME).{{ include "postgresql.fullname" . }}-svc.$(REPMGR_NAMESPACE).svc.cluster.local"
            - name: REPMGR_PARTNER_NODES
              value: {{ $name := include "postgresql.fullname" . }}{{ $replicas := int .Values.replicaCount }}{{ range $i := until $replicas }}{{ if $i }},{{ end }}{{ $name }}-sts-{{ $i }}.{{ $name }}-svc.$(REPMGR_NAMESPACE).svc.cluster.local{{ end }}
            - name: REPMGR_PRIMARY_HOST
              value: "{{ include "postgresql.fullname" . }}-sts-0.{{ include "postgresql.fullname" . }}-svc.$(REPMGR_NAMESPACE).svc.cluster.local"
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          livenessProbe:
            exec:
              command:
                - bash
                - -ec
                - 'PGPASSWORD=$POSTGRES_PASSWORD psql -w -U "postgres" -d "postgres"  -h 127.0.0.1 -c "SELECT 1"'
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - bash
                - -ec
                - 'PGPASSWORD=$POSTGRES_PASSWORD psql -w -U "postgres" -d "postgres"  -h 127.0.0.1 -c "SELECT 1"'
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /bitnami/postgresql
            - name: hooks-scripts
              mountPath: /pre-stop.sh
              subPath: pre-stop.sh
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: hooks-scripts
          configMap:
            name: {{ include "postgresql.fullname" . }}-configmap
            defaultMode: 0755
        - name: init-scripts
          configMap:
            name: {{ include "postgresql.fullname" . }}-init-scripts
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - "ReadWriteOnce"
        resources:
          requests:
            storage: "1Gi"