{{- if .Values.initDatabasesJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "postgresql.fullname" . }}-init-databases
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  template:
    metadata:
      name: {{ include "postgresql.fullname" . }}-init-databases
    spec:
      restartPolicy: Never
      containers:
      - name: init-databases
        image: public.ecr.aws/bitnami/postgresql-repmgr:12.9.0-debian-10-r18
        env:
          - name: PGPASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .Values.existingSecret | default (include "postgresql.fullname" .) | printf "%s-secrets" }}
                key: postgresql-password
          - name: PGHOST
            value: {{ include "postgresql.fullname" . }}-svc.{{ .Release.Namespace }}.svc.cluster.local
          - name: PGPORT
            value: "5432"
          - name: PGUSER
            value: "postgres"
        command:
          - /bin/bash
          - -c
          - |
            set -e
            echo "Waiting for PostgreSQL to be ready..."
            until PGPASSWORD=$PGPASSWORD pg_isready -h $PGHOST -p $PGPORT -U $PGUSER; do
              echo "PostgreSQL is unavailable - sleeping"
              sleep 2
            done
            echo "PostgreSQL is up - executing initialization script"
            bash /init-scripts/init-databases.sh
        volumeMounts:
          - name: init-scripts
            mountPath: /init-scripts
      volumes:
        - name: init-scripts
          configMap:
            name: {{ include "postgresql.fullname" . }}-init-scripts
            defaultMode: 0755
  backoffLimit: 5
{{- end }}
