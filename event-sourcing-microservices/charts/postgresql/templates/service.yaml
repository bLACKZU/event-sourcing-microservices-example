apiVersion: v1
kind: Service
metadata:
  name: {{ include "postgresql.fullname" . }}-svc
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 5432
      targetPort: postgresql
      protocol: TCP
      name: postgresql
  selector:
    app: postgres
