{{ if .Values.grafana.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "event-sourcing-microservices.fullname" . }}-grafana-dashboard-spring
  labels:
    app: {{ include "event-sourcing-microservices.name" . }}
    chart: {{ include "event-sourcing-microservices.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    grafana_dashboard: "1"
data:
  {{- (.Files.Glob "dashboards/*").AsConfig | nindent 2 }}
{{ end }}