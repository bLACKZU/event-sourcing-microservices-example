{{- range .Values.microservices }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "event-sourcing-microservices.fullname" $ }}-{{ .name }}
  labels:
    {{- toYaml .image.labels | nindent 4 }}
    {{- include "event-sourcing-microservices.labels" $ | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- toYaml .image.labels | nindent 4 }}
    {{- include "event-sourcing-microservices.selectorLabels" $ | nindent 4 }}
{{- end }}
