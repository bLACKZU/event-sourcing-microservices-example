spring:
  profiles: default,development,docker,kubernetes,test
  application:
    name: recommendation-service
management:
  endpoints:
    web:
      exposure:
        include: "*"
    enabled-by-default: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles}
    export:
      prometheus:
        descriptions: true
        enabled: ${prometheus.enabled:true}
        step: 1m
