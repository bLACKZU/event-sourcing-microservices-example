services:
  neo4j:
    environment:
      NEO4J_AUTH: none
    image: neo4j:3.5.0
    ports:
      - "7474:7474/tcp"
      - "7687:7687/tcp"
    deploy:
      replicas: 1

  friend-db:
    image: postgres:latest
    environment:
      POSTGRES_PASSWORD: example
    ports:
      - "54321:5432/tcp"
    deploy:
      replicas: 1

  user-db:
    image: postgres:latest
    environment:
      POSTGRES_PASSWORD: example
    ports:
      - "54322:5432/tcp"
    deploy:
      replicas: 1

  kafka:
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_BROKER_ID: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:32181
    image: wurstmeister/kafka:2.13-2.8.1
    ports:
      - "29092:29092/tcp"
    deploy:
      replicas: 1
    depends_on:
      - zookeeper

  zookeeper:
    environment:
      ZOOKEEPER_CLIENT_PORT: 32181
      ZOOKEEPER_TICK_TIME: 2000
    image: confluentinc/cp-zookeeper:latest
    ports:
      - "32181:32181/tcp"
    deploy:
      replicas: 1

  discovery-service:
    build:
      context: .
      dockerfile: discovery-service/Dockerfile
      args:
        JAR_FILE: discovery-service-0.0.1-SNAPSHOT.jar
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8761:8761/tcp"
    deploy:
      replicas: 1
    
  
  edge-service:
    build:
      context: .
      dockerfile: edge-service/Dockerfile
      args:
        JAR_FILE: edge-service-0.0.1-SNAPSHOT.jar
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "9000:9000/tcp"
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: '1000mb'
        reservations:
          cpus: '0.1'
          memory: '250mb'
    depends_on:
      - discovery-service
  

  friend-service:
    build:
      context: .
      dockerfile: friend-service/Dockerfile
      args:
        JAR_FILE: friend-service-0.0.2-SNAPSHOT.jar
    environment:
      SPRING_PROFILES_ACTIVE: docker
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: '1000mb'
        reservations:
          cpus: '0.1'
          memory: '250mb'
    depends_on:
      - discovery-service
      - kafka
      - friend-db

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
      args:
        JAR_FILE: user-service-0.0.2-SNAPSHOT.jar
    environment:
      SPRING_PROFILES_ACTIVE: docker
    deploy:
      replicas: 1
      resources:
        limits:
          memory: '1000mb'
          cpus: '0.5'
        reservations:
          cpus: '0.1'
          memory: '250mb'
    depends_on:
      - discovery-service
      - kafka
      - user-db
      

  recommendation-service:
    build:
      context: .
      dockerfile: recommendation-service/Dockerfile
      args:
        JAR_FILE: recommendation-service-0.0.1-SNAPSHOT.jar
    environment:
      SPRING_PROFILES_ACTIVE: docker
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: '1000mb'
        reservations:
          cpus: '0.1'
          memory: '250mb'
    depends_on:
      - discovery-service
      - kafka
      - neo4j
