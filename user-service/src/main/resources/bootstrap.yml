spring:
  profiles:
    group:
      production: default,development,test,docker,kubernetes
management:
  endpoints:
    web:
      exposure:
        include: "*"
    enabled-by-default: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles}
    export:
      prometheus:
        descriptions: true
        enabled: ${prometheus.enabled:true}
        step: 1m
---