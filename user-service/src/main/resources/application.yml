spring:
  application:
    name: user-service
  profiles:
    default: development
  cloud:
    stream:
      bindings:
        output:
          binder: kafka
          destination: user
          contentType: 'application/json'
          group: user-group
          producer:
            requiredGroups: user-group
server:
  port: ${PORT:${SERVER_PORT:8120}}
logging:
  level:
    root: INFO
    kafka.*: WARN
    org.springframework.*: INFO
    org.neo4j.*: INFO
    org.apache.kafka.*: WARN
    liquibase.integration.spring.SpringLiquibase: ERROR
---
postgres.port: 5432
postgres.host: user-db
postgres.url: jdbc:postgresql://user-db:5432/userdb
postgres.database-name: userdb
spring:
  config.activate.on-profile: development
  datasource:
    url: ${postgres.url}
    username: postgres
    password: example
    driver-class-name: org.postgresql.Driver
  r2dbc.url: r2dbc:${postgres.url}
  liquibase:
    url: ${postgres.url}
    user: postgres
    password: example
  cloud:
    kubernetes.discovery.enabled: false
    kubernetes.ribbon.enabled: false
    kubernetes.enabled: false
    stream:
      kafka:
        binder:
          brokers: kafka
          defaultBrokerPort: 29092
          zkNodes: zookeeper
          defaultZkPort: 32181
eureka:
  instance:
    prefer-ip-address: true
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://discovery-service:8761/eureka/
---
postgres.port: 5432
postgres.host: user-db
postgres.url: jdbc:postgresql://${postgres.host:localhost}:${postgres.port}/
postgres.database-name: postgres
spring:
  config.activate.on-profile: docker
  cloud:
    stream:
      kafka:
        binder:
          brokers: kafka
          defaultBrokerPort: 29092
          zkNodes: zookeeper
          defaultZkPort: 32181
    kubernetes.discovery.enabled: false
    kubernetes.ribbon.enabled: false
    kubernetes.enabled: false
  datasource:
    url: ${postgres.url}
    username: postgres
    password: example
    driver-class-name: org.postgresql.Driver
  liquibase:
    url: ${postgres.url}
    user: postgres
    password: example
eureka:
  instance:
    prefer-ip-address: true
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://discovery-service:8761/eureka/
---
spring:
  profiles: kubernetes
  cloud:
    kubernetes.discovery.enabled: true
    kubernetes.ribbon.enabled: true
    kubernetes.enabled: true
    stream:
      kafka:
        binder:
          brokers: "kafka:9092"
  datasource:
    url: jdbc:postgresql://pgpool-svc:5432/userdb
    username: ${postgres.username}
    password: ${POSTGRES_PASSWORD}
  r2dbc:
    url: r2dbc:postgresql://pgpool-svc:5432/userdb
    username: postgres
    password: ${POSTGRES_PASSWORD}
  liquibase:
    url: jdbc:postgresql://pgpool-svc:5432/userdb
    user: postgres
    password: ${POSTGRES_PASSWORD}
postgres:
  port: 5432
  host: pgpool-svc
  database-name: userdb
  url: jdbc:postgresql://pgpool-svc:5432/userdb
  username: postgres             # ← Now under kubernetes profile
prometheus:
  push:
    enabled: true
ribbon:
  eureka:
    enabled: false
eureka:
  client:
    enabled: false
---
postgres.port: 5432
postgres.host: localhost
postgres.url: ${spring.datasource.url}
postgres.database-name: postgres
prometheus.enabled: false
spring:
  profiles: test
  cloud:
    kubernetes.discovery.enabled: false
    kubernetes.ribbon.enabled: false
    kubernetes.enabled: false
  datasource:
    url: jdbc:postgresql://${postgres.host:localhost}:${postgres.port}
    data-username: postgres
    data-password: password
    driver-class-name: org.postgresql.Driver
  liquibase:
    url: ${spring.datasource.url}
    user: postgres
    password: password
eureka:
  client:
    enabled: false
